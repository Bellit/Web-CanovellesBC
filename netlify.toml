[build]
  command = "npm run build"
  publish = "dist"

# Redireccions de les URL de l'antic WordPress
[[redirects]]
  from = "/historia/"
  to = "/club/historia/"
  status = 301
[[redirects]]
  from = "/valors-missio-i-visio/"
  to = "/club/valors/"
  status = 301
[[redirects]]
  from = "/equipos/"
  to = "/equips/"
  status = 301
[[redirects]]
  from = "/contacta/"
  to = "/contacte/"
  status = 301
[[redirects]]
  from = "/torneo-premini/"
  to = "/activitats/torneig-premini/"
  status = 301
[[redirects]]
  from = "/3d3/"
  to = "/activitats/torneig-3d3/"
  status = 301
[[redirects]]
  from = "/feed/"
  to = "/noticies/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
